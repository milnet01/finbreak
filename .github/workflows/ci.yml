name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: lint + security + tests
    # Pinned, not `-latest`, so a runner-image rollover can't change the gate
    # under us; bump deliberately.
    runs-on: ubuntu-24.04
    # Run INSIDE the same image scripts/ci-docker.sh uses, so a local
    # `scripts/ci-docker.sh` run and this job install an identical environment
    # and run the identical gate — they cannot drift (FIBR-0001 INV-2). The
    # image ships Python 3.12, so no setup-python step is needed.
    #
    # HELD at bookworm (Debian 12, now oldstable) deliberately: this image's glibc
    # ~2.36 IS the effective floor of the frozen artifacts (pyproject.toml's
    # dependency comment explains why — libpython links it), so moving to trixie
    # would raise the minimum glibc every AppImage/.exe user needs. Bump only
    # together with build-smoke.sh + ci-docker.sh, and only as a deliberate
    # floor-raise. Tracked as FIBR-0180.
    container: python:3.12-slim-bookworm
    steps:
      # actions/checkout shells out to git, which the slim image lacks.
      - name: Install git for checkout
        run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates

      # Pinned to a commit SHA, not a tag (FIBR-0226). A tag is mutable: whoever
      # controls the action repo can repoint v7 and it lands in a finbreak build.
      # The trailing comment carries the human-readable version, and .github/
      # dependabot.yml rewrites BOTH on a new release — that pairing is the whole
      # decision, because a hash pin nobody maintains rots silently.
      #
      # persist-credentials: false — checkout otherwise leaves the job's token in
      # .git/config, readable by every later step (zizmor `artipacked`). Nothing
      # here pushes; the gate's git use (ls-files, check-ignore, rev-parse) is
      # local and needs no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # System libs (PySide6's OS deps) + gitleaks + Python deps. Shared with
      # scripts/ci-docker.sh — one definition, so local and CI can't diverge.
      - name: Prepare CI environment
        run: ./scripts/ci-setup.sh

      # Single source of truth for the gate stages: the same script a developer
      # runs locally (INV-2).
      - name: Run the gate
        run: ./scripts/ci-local.sh
